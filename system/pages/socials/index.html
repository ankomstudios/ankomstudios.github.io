<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="All of Ankom Studios' social links in one place.">
    <meta name="author" content="">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Socials — Ankom Studios" />
    <meta property="og:description" content="All of Ankom Studios' social links in one place." />
    <meta property="og:url" content="https://ankomstudios.com/socials/">

    <title>Socials | Ankom Studios</title>
    <link rel="shortcut icon" href="/assets/images/lightFav.png">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,700;1,400&family=Pirata+One&display=swap" rel="stylesheet">

    <link href="/assets/css/fontawesome.min.css" rel="stylesheet">
    <link href="/assets/css/solid.min.css" rel="stylesheet">
    <link href="/assets/css/brands.min.css" rel="stylesheet">

    <style>
      :root {
        --card-bg: #1b1d1f;
        --card-border: #2e3234;
        --link-bg: #2a2d2f;
        --link-bg-hover: #383c3f;
        --text: #ffffff;
        --text-dim: #a9b0b4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #26292b 0%, #0f1011 100%);
        font-family: 'Source Sans Pro', sans-serif;
        color: var(--text);
      }
      .socials-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
      }
      .socials-card {
        width: 100%;
        max-width: 380px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      }
      .socials-avatar {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        background: #000;
        border: 3px solid var(--card-border);
        margin-bottom: 16px;
      }
      .socials-name {
        font-family: 'Pirata One', 'Source Sans Pro', serif;
        font-size: 28px;
        margin: 0 0 6px;
      }
      .socials-tagline {
        font-size: 14px;
        color: var(--text-dim);
        margin: 0 0 28px;
      }
      .socials-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .socials-list a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: var(--link-bg);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
        transition: background-color 0.15s ease, transform 0.15s ease;
      }
      .socials-list a:hover {
        background: var(--link-bg-hover);
        transform: translateY(-1px);
      }
      .socials-list a i,
      .socials-list a svg {
        width: 20px;
        text-align: center;
        flex-shrink: 0;
      }
      .socials-list a.is-pending {
        opacity: 0.55;
      }
      .socials-list a.is-pending .pending-tag {
        margin-left: auto;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-dim);
      }
      .socials-back {
        display: inline-block;
        margin-top: 28px;
        font-size: 13px;
        color: var(--text-dim);
        text-decoration: none;
      }
      .socials-back:hover { color: var(--text); }
    </style>
  </head>

  <body>
    <div class="socials-wrap">
      <div class="socials-card">
        <img class="socials-avatar" src="/assets/images/logoPixel.png" alt="Ankom Studios">
        <h1 class="socials-name">Ankom Studios</h1>
        <p class="socials-tagline">Everywhere you can find us, in one place.</p>

        <ul class="socials-list">
          <li><a href="https://discord.gg/Gy6948c2j9" target="_blank" rel="noopener"><i class="fab fa-discord"></i>Discord</a></li>
          <li><a href="https://www.youtube.com/@ankomstudios" target="_blank" rel="noopener"><i class="fab fa-youtube"></i>YouTube</a></li>
          <li><a href="https://www.reddit.com/r/ankomstudios/" target="_blank" rel="noopener"><i class="fab fa-reddit"></i>Reddit</a></li>
          <li><a href="https://twitter.com/ankomstudios/" target="_blank" rel="noopener"><i class="fab fa-twitter"></i>Twitter / X</a></li>
          <li><a href="https://www.instagram.com/ankomstudios/" target="_blank" rel="noopener"><i class="fab fa-instagram"></i>Instagram</a></li>
          <li><a href="https://www.tiktok.com/@ankomstudios" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16.6 5.82s.51.5 0 0A4.278 4.278 0 0 1 15.54 3h-3.09v12.4a2.592 2.592 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6c0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64c0 3.33 2.76 5.7 5.69 5.7c3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg>TikTok</a></li>
          <li><a href="https://github.com/ankomstudios" target="_blank" rel="noopener"><i class="fab fa-github"></i>GitHub</a></li>
        </ul>

        <a class="socials-back" href="/">&larr; Back to ankomstudios.com</a>
      </div>
    </div>
  </body>
</html>
